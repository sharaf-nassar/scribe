# Config seeded into the visual container for the update-surface E2E pair.
#
# The status bar's system-stat sparklines resample every 2 s, so leaving them on
# would make the bottom band differ between any two screenshots and drown the
# one change under test — the centred update CTA appearing. Turning them off
# makes the band deterministic and leaves the CTA as the only moving part.
[terminal.status_bar_stats]
cpu = false
gpu = false
memory = false
network = false
