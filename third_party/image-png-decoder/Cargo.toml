[package]
name = "scribe-png-decoder"
version = "0.18.1-scribe.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded decoder-only png fork for Scribe"
repository = "https://github.com/scribe-terminal/scribe"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = { version = "1.1.9", default-features = false, features = [
  "rust_backend",
] }
scribe-image-decode = { path = "../../crates/scribe-image-decode" }

[lints.rust]
unsafe_code = "forbid"

[workspace]
