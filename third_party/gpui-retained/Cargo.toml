[workspace]
members = ["gpui", "gpui_wgpu"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
accesskit = { "version" = "0.24.0", "features" = ["enumn"] }
anyhow = "1.0.86"
async-channel = "2.5.0"
backtrace = "0.3"
bitflags = "2.6.0"
chrono = { "version" = "0.4", "features" = ["serde"] }
cocoa = "=0.26.0"
cocoa-foundation = "=0.2.0"
collections = { "version" = "0.1.0", "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
core-foundation = "=0.10.0"
core-foundation-sys = "0.8.6"
core-video = { "version" = "0.5.2", "features" = ["metal"] }
criterion = { "version" = "0.5", "features" = ["html_reports"] }
ctor = "1.0.6"
derive_more = { "version" = "2.1.1", "features" = [
  "add",
  "add_assign",
  "deref",
  "deref_mut",
  "display",
  "from_str",
  "mul",
  "mul_assign",
  "not",
] }
env_logger = "0.11"
futures = "0.3.32"
futures-concurrency = "7.7.1"
gpui = { "path" = "gpui", "default-features" = false }
gpui_macros = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
gpui_platform = { "default-features" = false, "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
gpui_shared_string = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
gpui_util = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
gpui_web = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
hdrhistogram = "7"
heapless = "0.9.2"
http_client = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
image = { "version" = "0.25.1", "default-features" = false, "features" = [
  "bmp",
  "dds",
  "exr",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "rayon",
  "tga",
  "tiff",
  "webp",
] }
inventory = "0.3.19"
itertools = "0.14.0"
log = { "version" = "0.4.16", "features" = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
media = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
parking_lot = "0.12.1"
pollster = "0.4.0"
postage = { "version" = "0.5", "features" = ["futures-traits"] }
profiling = "1"
proptest = { "git" = "https://github.com/proptest-rs/proptest", "rev" = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", "features" = [
  "attr-macro",
] }
rand = "0.9"
refineable = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
regex = "1.5"
reqwest_client = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
resvg = { "version" = "0.46.0", "default-features" = false, "features" = [
  "text",
  "system-fonts",
  "memmap-fonts",
  "raster-images",
] }
scap = { "git" = "https://github.com/zed-industries/scap", "rev" = "4afea48c3b002197176fb19cd0f9b180dd36eaac", "default-features" = false, "package" = "zed-scap", "version" = "0.0.8-zed" }
scheduler = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
schemars = { "version" = "1.0", "features" = ["indexmap2"] }
serde = { "version" = "1.0.221", "features" = ["derive", "rc"] }
serde_json = { "version" = "1.0.144", "features" = [
  "preserve_order",
  "raw_value",
] }
slotmap = "1.0.6"
smallvec = { "version" = "1.6", "features" = ["union", "const_new"] }
stacksafe = "0.1"
strum = { "version" = "0.27.2", "features" = ["derive"] }
sum_tree = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
thiserror = "2.0.12"
unicode-segmentation = "1.10"
url = "2.2"
usvg = { "version" = "0.46.0", "default-features" = false }
util_macros = { "git" = "https://github.com/zed-industries/zed.git", "rev" = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
uuid = { "version" = "1.1.2", "features" = ["v4", "v5", "v7", "serde"] }
wasm-bindgen = "0.2.120"
web-time = "1.1.0"
wgpu = "29.0.4"

[workspace.lints.rust]
unexpected_cfgs = { "level" = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { "level" = "allow", "priority" = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
