[package]
name = "scribe-test"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
rust-version.workspace = true
description = "E2E test harness for Scribe terminal emulator"
publish = false

[[bin]]
name = "scribe-test"
path = "src/main.rs"

[dependencies]
scribe-common.workspace = true
# The LAN peer stand-in terminates a REAL mutual-TLS handshake with the same
# server-owned `LanTls` builder the shipped listener uses, so the client under
# test is never talking to a hand-rolled TLS shim.
scribe-server.workspace = true
# Applying a `SessionReplay` locally uses the same terminal core, event
# listener, and VTE processor the server feeds real PTY bytes through, so the
# harness's replayed view is not a second emulator with its own quirks.
alacritty_terminal.workspace = true
scribe-pty.workspace = true
vte.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
clap.workspace = true
regex.workspace = true
cosmic-text = { version = "0.17", features = [
  "shape-run-cache",
  "monospace_fallback",
] }
png = "0.17"
png_spike = { package = "png", version = "0.18.1" }
flate2 = { version = "1.1.9", default-features = false, features = [
  "rust_backend",
] }
tracing.workspace = true
nix.workspace = true

[lints]
workspace = true
