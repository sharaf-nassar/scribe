[package]
name = "scribe-test"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
rust-version.workspace = true
description = "E2E test harness for Scribe terminal emulator"
publish = false

[[bin]]
name = "scribe-test"
path = "src/main.rs"

[dependencies]
scribe-common.workspace = true
# The LAN peer stand-in terminates a REAL mutual-TLS handshake with the same
# server-owned `LanTls` builder the shipped listener uses, so the client under
# test is never talking to a hand-rolled TLS shim.
scribe-server.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
regex.workspace = true
cosmic-text.workspace = true
png.workspace = true
tracing.workspace = true
nix.workspace = true

[lints]
workspace = true
