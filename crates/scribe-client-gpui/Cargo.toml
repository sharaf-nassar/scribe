[package]
name = "scribe-client-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPUI display-only client spike for Scribe"

[lints]
workspace = true

[lib]
name = "scribe_client_gpui"
path = "src/lib.rs"

[[bin]]
name = "scribe-client-gpui"
path = "src/main.rs"

[dependencies]
alacritty_terminal_gpui = { package = "alacritty_terminal", git = "https://github.com/zed-industries/alacritty.git", rev = "4c129667" }
gpui.workspace = true
gpui_platform.workspace = true
scribe-common.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width = "0.2"
vte.workspace = true

[dev-dependencies]
# Pulls in gpui's headless TestAppContext / #[gpui::test] harness for the
# layout entity suites without affecting the shipped client build.
gpui = { workspace = true, features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true
