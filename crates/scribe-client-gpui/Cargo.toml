[package]
name = "scribe-client-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPUI display-only client spike for Scribe"

[lints]
workspace = true

[lib]
name = "scribe_client_gpui"
path = "src/lib.rs"

[[bin]]
name = "scribe-client-gpui"
path = "src/main.rs"

[dependencies]
alacritty_terminal_gpui = { package = "alacritty_terminal", git = "https://github.com/zed-industries/alacritty.git", rev = "4c129667" }
gpui.workspace = true
gpui_platform.workspace = true
notify.workspace = true
regex.workspace = true
# Settings window: singleton socket peer-cred/flock, one-shot server-action
# framing, and the {key,value} config-apply payloads.
nix.workspace = true
rmp-serde.workspace = true
scribe-common.workspace = true
# Feature 014 LAN remote control: the connecting client reuses the server's
# device identity (keyring-sealed cert) and the SPKI-pinning mutual-TLS dialer
# (`LanTls::connect`), so the security-critical verifier and its signature
# delegation live in ONE place instead of being duplicated client-side — the
# same dependency, for the same reason, that `scribe-client` takes.
# tokio-rustls names the dialer-side encrypted stream type.
scribe-server.workspace = true
serde_json.workspace = true
tokio-rustls.workspace = true
# Window geometry persistence (window_state) serializes WindowGeometry to the
# per-window state.toml files.
serde.workspace = true
# System resource sampling (sys_stats): CPU/memory/network/GPU sparkline feeds.
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width = "0.2"
vte.workspace = true

# X11 focus guard: reads GPUI's Xcb/Xlib window id and polls _NET_ACTIVE_WINDOW.
# Clipboard bridge (arboard) and the zbus-backed notification dispatcher.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = [
  "wayland-data-control",
] }
futures-util.workspace = true
raw-window-handle.workspace = true
x11rb.workspace = true
zbus.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3", default-features = false }

[dev-dependencies]
# Pulls in gpui's headless TestAppContext / #[gpui::test] harness for the
# layout entity suites without affecting the shipped client build.
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
# Asserts the embedded Symbols Nerd Font asset keeps the cmap shape GPUI's
# face-eviction check and the fallback chain depend on.
ttf-parser = "0.25"
