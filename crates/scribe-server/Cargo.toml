[lib]
name = "scribe_server"
path = "src/lib.rs"

[[bin]]
name = "scribe-server"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = [
  "rmp-serde",
  "serde",
  "thiserror",
  "uuid",
  "reqwest",
  "semver",
  "serde_json",
  "minisign-verify",
]

[dependencies]
scribe-common.workspace = true
scribe-image-decode.workspace = true
icy-sixel-decoder = { path = "../../third_party/icy-sixel-decoder" }
alacritty_terminal.workspace = true
cursor-icon.workspace = true
unicode-width.workspace = true
ammonia = "4.1"
dirs.workspace = true
scribe-pty.workspace = true
tokio.workspace = true
serde.workspace = true
rmp-serde.workspace = true
toml.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vte.workspace = true
regex.workspace = true
nix.workspace = true
socket2.workspace = true
rustix.workspace = true
unix-ancillary.workspace = true
libc.workspace = true
reqwest.workspace = true
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = [
  "html",
] }
semver.workspace = true
serde_json.workspace = true
# `hdiutil info -plist` is the documented machine-readable interface for
# discovering which devices an update DMG still has attached. Not macOS-gated:
# keeping the parser cross-platform is what lets Linux CI test it.
plist = "1"
minisign-verify.workspace = true
sha2 = "0.10"
sysinfo.workspace = true
keyring = { workspace = true }
chacha20poly1305 = { workspace = true }
# LAN remote control (feature 014): mDNS discovery, physical-network
# fingerprint, self-signed Ed25519 identity cert, and async mutual TLS.
# rustls is a direct dependency here (default aws-lc-rs provider), no longer
# only a reqwest transitive. x509-parser extracts a peer certificate's SPKI so
# the TLS pinning verifier can derive its SHA-256(SPKI) Device ID.
mdns-sd.workspace = true
netdev.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true

[dev-dependencies]
# test-util: provides #[tokio::test] macro for async tests.
tokio = { workspace = true, features = ["test-util"] }
# nix::pty::openpty() is available via the existing "term" feature — no extra
# dev-dependency needed for nix.
