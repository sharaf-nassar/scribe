[package]
name = "scribe-hook-helper"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
rust-version.workspace = true
description = "Scribe AI tool hook event emitter binary"

[[bin]]
name = "scribe-hook-helper"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
scribe-common = { workspace = true }
tokio = { workspace = true, features = [
  "rt",
  "macros",
  "io-util",
  "io-std",
  "net",
  "time",
] }
clap.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
