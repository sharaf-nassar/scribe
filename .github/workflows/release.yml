name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - label: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-bin: "false"

      - name: Inject version
        env:
          TAG: ${{ github.ref_name }}
        run: bash dist/ci/inject-version.sh "${TAG#v}"

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libvulkan-dev

      - name: Install cargo-deb
        if: matrix.os == 'linux'
        run: cargo install cargo-deb --locked

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux .deb)
        if: matrix.os == 'linux'
        run: cargo deb -p scribe-server --no-build --target ${{ matrix.target }}

      - name: Install minisign
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          if [[ "$MATRIX_OS" == "linux" ]]; then
            MSIGN_VER="0.12"
            ARCH="$(uname -m)"
            curl -fsSL "https://github.com/jedisct1/minisign/releases/download/${MSIGN_VER}/minisign-${MSIGN_VER}-linux.tar.gz" \
              | sudo tar xz -C /usr/local/bin --strip-components=2 "minisign-linux/${ARCH}/minisign"
          fi

      - name: Locate and sign artifact
        id: artifact
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.ref_name }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_LABEL: ${{ matrix.label }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$MATRIX_OS" == "linux" ]]; then
            SRC=$(find "target/${MATRIX_TARGET}/debian" -name '*.deb' | head -1)
            DEST="scribe_${TAG}_${MATRIX_LABEL}.deb"
          fi
          cp "$SRC" "$DEST"
          KEYFILE="$(mktemp)"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEYFILE"
          minisign -Sm "$DEST" -s "$KEYFILE"
          rm -f "$KEYFILE"
          echo "artifact=$DEST" >> "$GITHUB_OUTPUT"
          echo "sigfile=${DEST}.minisig" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ steps.artifact.outputs.artifact }}
            ${{ steps.artifact.outputs.sigfile }}
          if-no-files-found: error

  # Deferred deliberately at GPUI cutover. See bead scribe-38e.104 before
  # restoring DMG creation, signing, notarization, or macOS runner usage.
  macos-packaging-deferred:
    name: macOS packaging (deferred)
    if: ${{ false }}
    runs-on: macos-14
    steps:
      - run: echo "macOS GPUI port is tracked in scribe-38e.104"

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            artifacts/*.deb artifacts/*.minisig
