[workspace]
members = ["crates/*"]
exclude = ["third_party/icy-sixel-decoder", "third_party/unix-ancillary"]
resolver = "3"

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
description = "Scribe terminal emulator"
repository = "https://github.com/scribe-terminal/scribe"
readme = "README.md"
keywords = ["terminal", "pty", "emulator"]
categories = ["command-line-utilities"]

[workspace.dependencies]
# Async
tokio = { version = "1.50", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "io-std",
  "process",
  "sync",
  "net",
  "signal",
  "fs",
  "time",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
zstd = { version = "0.13", default-features = false }

# Terminal
vte = { version = "0.15", features = ["ansi"] }
alacritty_terminal = { version = "0.26.0-rc1", default-features = false }
toml = "0.8"
dirs = "6"
notify = "8"

# CLI
clap = { version = "4", features = ["derive"] }
regex = "1"

# Utilities
uuid = { version = "1.22", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "registry",
] }
bytes = "1"

# OS keystore + crypto (feature 006)
keyring = { version = "3.6", default-features = false, features = [
  "apple-native",
  "sync-secret-service",
  "crypto-rust",
] }
chacha20poly1305 = { version = "0.10", features = ["std", "rand_core"] }

# PTY / OS bindings
nix = { version = "0.31", features = [
  "term",
  "process",
  "signal",
  "fs",
  "hostname",
  "user",
  "socket",
  "uio",
] }
socket2 = "0.6"
rustix = { version = "1.1", features = ["net", "process"] }
libc = "0.2"
unix-ancillary = "0.1"
x11rb = { version = "0.13", default-features = false }
raw-window-handle = "0.6"

# GPUI client
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "f96212f2c50f54d93712fa130d6226b1ce7d76b5", default-features = false, features = [
  "font-kit",
  "x11",
  "wayland",
] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "f96212f2c50f54d93712fa130d6226b1ce7d76b5", default-features = false, features = [
  "font-kit",
  "x11",
  "wayland",
] }
gpui_tokio = { git = "https://github.com/zed-industries/zed.git", rev = "f96212f2c50f54d93712fa130d6226b1ce7d76b5" }
# Settings and updates
sysinfo = "0.35"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
semver = "1.0"
minisign-verify = "0.2"

# Linux desktop notification dispatcher.
#
# Deliberately NOT built with the `tokio` feature. Cargo unifies features
# across the whole graph, and GPUI's Linux platform layer pulls the same
# `zbus` build through accesskit_unix (AT-SPI), ashpd (XDG portals), and
# oo7 (secret service). zbus's `tokio` feature is compile-time exclusive:
# it routes every internal `Task::spawn_blocking` through
# `tokio::task::spawn_blocking`, which panics with "there is no reactor
# running" when polled off a Tokio runtime. GPUI drives its zbus
# connections on its own non-Tokio worker threads, so enabling `tokio`
# here crashed those background threads on every client launch. The
# default async-io backend is runtime-agnostic — zbus spawns its own
# internal executor thread — so it works from GPUI's workers and from our
# notification dispatcher's Tokio runtime alike.
zbus = { version = "5" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# LAN remote control (feature 014) — mDNS discovery, physical-network
# fingerprint, self-signed Ed25519 identity, and async mutual TLS. rustls is
# promoted from a reqwest transitive to a direct dependency; default features
# select the aws-lc-rs crypto provider (shared with rcgen and tokio-rustls).
# x509-parser (already compiled via rcgen) extracts a presented certificate's
# SubjectPublicKeyInfo so the TLS pinning verifier can derive the peer's
# SHA-256(SPKI) Device ID — no rustls/webpki API exposes the SPKI directly.
mdns-sd = "0.20"
netdev = "0.45"
rcgen = "0.14"
rustls = "0.23"
tokio-rustls = "0.26"
x509-parser = "0.18"

# Workspace crates
scribe-common = { path = "crates/scribe-common" }
scribe-pty = { path = "crates/scribe-pty" }
scribe-server = { path = "crates/scribe-server" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Groups (priority -1 so individual overrides take effect)
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Restriction lints (cherry-picked)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
string_add = "deny"
panic_in_result_fn = "deny"
error_impl_error = "deny"
shadow_unrelated = "deny"
rc_mutex = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"
# Full allow/expect bans are enforced on new diffs by
# tools/check-no-new-lint-suppressions.sh until legacy narrow allows are retired.
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"

# Nursery (cherry-picked stable)
# cognitive_complexity is disabled while the scribe-client rebuild is in
# flight. Pulling the pinned gpui/alacritty client deps into the workspace
# changes the unified feature set of shared dependencies (notably the tracing
# logging macros), which inflates this nursery lint's per-function counts across
# many otherwise-unchanged server-side functions (up to 80/15) that pass cleanly
# without the client crate present. Re-evaluate (recalibrated threshold or split
# functions) during the port phases; tracked with the gpui-client-rebuild epic.
cognitive_complexity = "allow"
useless_let_if_seq = "deny"
redundant_pub_crate = "deny"
option_if_let_else = "deny"

# Pedantic overrides (genuinely noisy)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Cargo overrides — transitive dep version conflicts are unavoidable
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# GPUI's hot rendering paths need optimized dev builds for responsive local
# iteration. Keep this package override when the GPUI client is added.
[profile.dev.package.gpui]
opt-level = 3

# Local fork of unix-ancillary 0.1.0 — upstream 0.1.0 fails to compile on Apple
# targets because `set_cloexec` references `io::Result` without importing
# `std::io`. Drop this patch once a fixed release ships on crates.io.
[patch.crates-io]
unix-ancillary = { path = "third_party/unix-ancillary" }
