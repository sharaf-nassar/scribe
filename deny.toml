[graph]
all-features = true

[output]
feature-depth = 1

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "warn"
allow = [
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  # libbz2-rs-sys (pure-Rust libbz2) ships the permissive bzip2/libbzip2 license;
  # pulled transitively via bzip2 -> compression-codecs by gpui's http_client.
  "bzip2-1.0.6",
]

[licenses.private]
ignore = true

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
ignore = [
  # Owner: Scribe maintainers. Review by 2026-08-01 or when transitive users update.
  # time 0.3.x stack exhaustion DoS — transitive via various crates
  "RUSTSEC-2026-0009",
  # Owner: Scribe maintainers. Review by 2026-09-01 or when wayland-scanner and
  # notify-rust move to quick-xml >=0.41 (the fix version; parents pin 0.39/0.37).
  # quick-xml DoS advisories (quadratic duplicate-attribute check, unbounded NsReader
  # namespace allocation) — transitive via wayland-scanner (build-time parse of vendored
  # Wayland protocol XML) and tauri-winrt-notification (Windows-only, parses toast XML
  # the app generates itself); neither path parses untrusted input
  "RUSTSEC-2026-0194", # quick-xml
  "RUSTSEC-2026-0195", # quick-xml
  # Owner: Scribe maintainers. Review by 2026-08-01 or when cosmic-text/winit update.
  # ttf-parser unmaintained — transitive via cosmic-text/fontdb & winit/ab_glyph; no safe upgrade
  "RUSTSEC-2026-0192", # ttf-parser
  # Owner: Scribe maintainers. Review by 2026-10-01 or when netdev's netlink
  # backend (netlink-packet-core/netlink-packet-route) moves off the archived
  # `paste` crate.
  # paste unmaintained/archived, no safe upgrade — compile-time proc-macro,
  # transitive via netdev (LAN trusted-network fingerprint, feature 014)
  "RUSTSEC-2024-0436", # paste
  # Owner: Scribe maintainers. Review by 2026-10-01 or when gpui's usvg/resvg
  # (SVG icon rasterization) move off rustybuzz to harfrust.
  # rustybuzz unmaintained, no safe upgrade — transitive via gpui (usvg/resvg)
  # for the pinned zed revision; used only for static SVG shaping, not untrusted
  # input.
  "RUSTSEC-2026-0206", # rustybuzz
  # Owner: Scribe maintainers. Review by 2026-10-01 or when the gpui pin moves to
  # patched transitive versions.
  # The following are all pulled transitively by the pinned gpui git dependency
  # for the scribe-client rebuild spike:
  "RUSTSEC-2026-0190", # anyhow — Error::downcast_mut() unsoundness (via gpui)
  "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained (build-time proc-macro)
  "RUSTSEC-2026-0097", # rand — unsoundness with a custom logger using rng()
]

[bans]
multiple-versions = "warn"
# Workspace-internal path crates use .workspace = true which cargo-deny
# sees as version = "*". Allow wildcards only for our own workspace crates.
wildcards = "allow"
highlight = "all"

deny = [
  { crate = "openssl", reason = "Use rustls instead" },
  { crate = "openssl-sys", reason = "Use rustls instead" },
]

# Duplicate-version exceptions. None of these are ours to converge: the whole
# workspace resolves to a single version of every crate it picks itself, and
# `cargo tree -d -p scribe-server` reports exactly one duplicate (getrandom,
# below). Everything else enters through a pinned upstream fork whose own
# dependency graph we do not control.
#
# These exist so a duplicate we DO introduce is visible. Without them the check
# reports ~58 permanent warnings, and a 59th would go unnoticed — which is the
# opposite of what the check is for. Deleting an entry must mean the duplicate
# is genuinely gone, never that the warning became inconvenient.
skip-tree = [
  # Owner: Scribe maintainers. Review when the gpui pin moves.
  # The pinned zed gpui revision brings its own resolved graph (windows-* family,
  # syn, toml, hashbrown, cosmic-text, harfrust, objc2, ...). Converging it would
  # mean patching gpui's dependencies, not ours.
  { crate = "gpui", reason = "pinned zed gpui revision resolves its own transitive graph" },
  # Owner: Scribe maintainers. Review when the client stops needing zed's fork.
  # scribe-client imports zed's display-only alacritty fork as
  # `alacritty_terminal_gpui` while scribe-pty/server/test use the crates.io
  # 0.26.0-rc1. The alias is deliberate and makes the split explicit at every
  # import site; the two are not interchangeable.
  { crate = "alacritty_terminal@0.26.1-dev", reason = "client uses zed's display-only fork under an explicit alias" },
]

# Remaining duplicates after the skip-trees above. Every one was traced to a
# transitive consumer; none is a direct dependency of any scribe crate, so none
# can be converged from this workspace.
#
# Owner: Scribe maintainers. Review when the gpui pin moves.
skip = [
  # Font stack: fontconfig-parser, swash, and gpui's own text pipeline pull
  # different releases of the same Google Fonts crates.
  { crate = "font-types", reason = "read-fonts 0.34 and 0.37 pull different font-types" },
  { crate = "read-fonts", reason = "fontconfig-parser and gpui's text stack disagree" },
  { crate = "skrifa", reason = "font stack consumers disagree" },
  # macOS windowing and accessibility, entirely inside the gpui platform layer.
  { crate = "objc2", reason = "gpui platform crates span two objc2 generations" },
  { crate = "objc2-app-kit", reason = "gpui platform crates span two objc2 generations" },
  { crate = "objc2-foundation", reason = "gpui platform crates span two objc2 generations" },
  { crate = "accesskit_consumer", reason = "accesskit adapters pin three releases" },
  # Same parents as the quick-xml advisories ignored above: wayland-scanner
  # parses vendored protocol XML at build time, notify-rust is Windows-only.
  { crate = "quick-xml", reason = "wayland-scanner and notify-rust pin 0.39/0.37" },
  # hashbrown rides along with the above; no scribe crate depends on it directly.
  { crate = "hashbrown", reason = "transitive consumers span 0.14 and 0.15" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# gpui's `test-support` feature (dev-dependency of the GPUI client rebuild, used
# by the layout `#[gpui::test]` suites) pulls a pinned proptest fork from the
# proptest-rs org. The rev is locked in Cargo.lock; allow just this repo rather
# than the whole org.
allow-git = ["https://github.com/proptest-rs/proptest"]

# The GPUI client rebuild consumes gpui (pinned zed rev) and its display-only
# alacritty fork as git dependencies; gpui in turn pulls several Zed-maintained
# forks (font-kit, scap, xim-rs) from the same org. Revisions are pinned in
# Cargo.toml / the crate manifest and Cargo.lock. Allow the zed-industries org
# rather than enumerating each fork so a gpui-pin bump does not silently break.
[sources.allow-org]
github = ["zed-industries"]
