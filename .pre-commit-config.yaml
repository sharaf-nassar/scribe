default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args: [--no-schema]

  - repo: local
    hooks:
      - id: no-new-lint-suppressions
        name: no new lint suppressions
        entry: tools/check-no-new-lint-suppressions.sh --staged
        language: system
        types: [rust]
        pass_filenames: false

      - id: reachability-baseline
        name: gpui client reachability baseline
        entry: tools/check-reachability.sh --staged
        language: system
        files: ^(crates/scribe-client/src/.*\.rs|crates/scribe-common/src/protocol\.rs|tools/check-reachability\.sh|tools/reachability-baseline\.txt)$
        pass_filenames: false

      - id: parity-inventory
        name: 016 parity inventory counts
        entry: tools/check-parity-inventory.sh --staged
        language: system
        files: ^(specs/016-gpui-client-rebuild/(parity-inventory|spec)\.md|crates/scribe-client/src/(main|input)\.rs|crates/scribe-common/src/protocol\.rs|tools/check-parity-inventory\.sh)$
        pass_filenames: false

      - id: beads-board-contract
        name: A2/A3 contract and coverage
        entry: python3 .impeccable/mocks/check-contract.py
        language: system
        files: ^(\.impeccable/mocks/(a2a3-contract\.json|beads-board-directions\.html|check-contract\.py|check-flow\.py|gen-contract\.py)|specs/028-beads-board-contract\.md|crates/scribe-client/src/beads_(board|board_a2|flow)\.rs|tests/e2e/(beads_board_image_oracle\.py|func/beads-board\.sh|visual/beads-board(\.sh|-oracle\.py))|justfile)$
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        types: [rust]
        pass_filenames: false
